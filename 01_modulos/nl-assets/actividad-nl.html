<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Fiscal NL — Actividad económica y precios</title>
<!--
  Plantilla versionada: 01_modulos/nl-assets/actividad-nl.html (capa NL).
  01_modulos/PIBDeflactorNL.do sustituye la marca de datos por el JSON
  (users/$id/nodos/actividad-nl.json) y deja el HTML autocontenido en
  users/$id/nodos/actividad-nl.html. Cero CDNs, cero fetch, cero red.
  Regla dura: ningún número vive en esta plantilla; todos vienen del JSON.
  Modo datos: cada vista tiene tabla (valores del canal, sin recálculo), copia
  TSV y descarga CSV con encabezado de procedencia; nada sale sin procedencia.
-->
<style>
:root{--nl:#0b4f6c;--nl2:#2a6f97;--nac:#c9553d;--now:#e8a33d;--proy:#9aa5b1;--ink:#1f2933;--mut:#616e7c;--line:#d9dde3;--bg:#f7f8fa;--card:#fff;--shade:#eef1f5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4}
header{background:var(--nl);color:#fff;padding:18px 28px}
header h1{margin:0;font-size:22px;font-weight:600}
header .sub{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:1240px;margin:0 auto;padding:18px 20px 30px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--nl);color:#fff;border-color:var(--nl)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 22px;align-items:end}
.ctl label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.ctl select,.ctl input[type=number]{padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;color:var(--ink)}
.ctl select{width:100%}
.rng{display:flex;align-items:center;gap:8px}.rng input{width:84px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--nl);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:7px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.card .v{font-size:26px;font-weight:600;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.card .n{font-size:12px;color:var(--mut)}
.card .d{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:#1b7f3b}.neg{color:#b42318}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.charts.tabla{grid-template-columns:1fr}.chart{min-width:0}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.chart h2{margin:0 0 6px;font-size:15px;font-weight:600}
.chart .cap{font-size:12px;color:var(--mut);margin:0 0 6px;min-height:16px}
.chart .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
svg{width:100%;height:auto;display:block}
.ax{stroke:#9aa5b1;stroke-width:1}.grid{stroke:#e5e8ec;stroke-width:1}.zero{stroke:#6b7785;stroke-width:1.2}
.tick{font-size:11px;fill:var(--mut)}.lab{font-size:12px;fill:var(--ink)}
.b-obs{fill:var(--nl2)}.b-now{fill:var(--now)}.b-proy{fill:var(--proy)}.b-last{stroke:#1f2933;stroke-width:1.5}
.lt{fill:none;stroke-width:2.2}.lt-nac{stroke:var(--nac)}.lt-nl{stroke:var(--nl2)}.lt-def{stroke:#7b5ea7;stroke-dasharray:5 3}
.dot-nac{fill:var(--nac)}.dot-nl{fill:var(--nl2)}
.shade{fill:var(--shade)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.tip{font-size:12px;color:var(--ink);min-height:16px;margin-top:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools button,.seg2 button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.seg2{display:inline-flex;border-radius:6px;overflow:hidden}
.seg2 button.on{background:var(--nl);color:#fff;border-color:var(--nl)}
.tbl-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#f1f3f6;color:var(--mut);font-weight:600;text-align:right}
td:first-child,th:first-child{text-align:left}
tr.r-now td{background:#fff8ea}tr.r-proy td{background:#f3f4f6;color:#5b6773}
.prov{font-size:11.5px;color:var(--mut);margin:6px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.msg{font-size:12px;color:var(--mut);min-height:16px}
textarea.fb{width:100%;height:160px;font-family:ui-monospace,Menlo,monospace;font-size:11px;margin-top:6px;display:none}
footer{max-width:1240px;margin:0 auto;padding:10px 20px 40px;font-size:12px;color:var(--mut)}
footer p{margin:4px 0}
.ok{color:#1b7f3b}.bad{color:#b42318}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Simulador Fiscal NL — Actividad económica y precios</h1>
  <p class="sub" id="subtitulo"></p>
</header>
<main>
  <div class="tabs" id="tabs">
    <button data-v="crecimiento" class="on">Crecimiento</button>
    <button data-v="precios">Precios</button>
  </div>

  <section class="panel controls">
    <div class="ctl">
      <label>Rango de años (series anuales)</label>
      <div class="rng"><input type="number" id="ini"> <span>–</span> <input type="number" id="fin"></div>
    </div>
    <div class="ctl" id="ctl-serie">
      <label for="serie">Serie</label>
      <select id="serie"></select>
    </div>
    <div class="ctl">
      <label>Comparativo</label>
      <div class="chk"><input type="checkbox" id="cmp" checked><label for="cmp" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:0">Mostrar nacional</label></div>
    </div>
    <div class="ctl">
      <label>Modo</label>
      <div class="seg" id="modo"><button data-m="grafica" class="on">Gráfica</button><button data-m="tabla">Tabla</button></div>
    </div>
  </section>

  <section class="cards" id="cards"></section>

  <section class="charts" id="charts">
    <div class="panel chart" id="c1">
      <div class="bar"><h2 id="c1-title"></h2><div class="tools" id="c1-tools"></div></div>
      <p class="cap" id="c1-cap"></p>
      <div id="c1-body"></div>
      <div class="legend" id="c1-leg"></div>
      <div class="tip" id="c1-tip"></div>
    </div>
    <div class="panel chart" id="c2">
      <div class="bar"><h2 id="c2-title"></h2><div class="tools" id="c2-tools"></div></div>
      <p class="cap" id="c2-cap"></p>
      <div id="c2-body"></div>
      <div class="legend" id="c2-leg"></div>
      <div class="tip" id="c2-tip"></div>
    </div>
  </section>
</main>
<footer id="pie"></footer>

<script>
window.NLACT =
/*__NLACT_DATA__*/
;
</script>
<script>
(function () {
  'use strict';
  var D = window.NLACT;
  if (!D || !D.anual) { document.getElementById('pie').innerHTML = '<p class="bad">Sin datos: el JSON no fue incrustado.</p>'; return; }
  var P = D.procedencia || {}, C = D.cifras || {}, DEF = D.definiciones || {};
  var f1 = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var f2 = new Intl.NumberFormat('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var f0 = new Intl.NumberFormat('es-MX', { maximumFractionDigits: 0 });
  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function pct(v) { return v === null || v === undefined ? '—' : f2.format(v) + ' %'; }
  function sgn(v) { return v === null || v === undefined ? '—' : (v >= 0 ? '+' : '') + f2.format(v) + ' pp'; }
  function cls(v) { return v === null || v === undefined ? '' : (v >= 0 ? 'pos' : 'neg'); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  var A = D.anual, Q = D.trimestral, M = D.mensual;
  var A0 = A[0].anio, A1 = A[A.length - 1].anio;
  var SERIES = {
    crecimiento: [['pibe', 'Crecimiento real anual (PIBE) y nowcast ITAEE'], ['itaee', 'ITAEE trimestral: variación anual (original)'], ['itaeesa', 'ITAEE trimestral: variación trimestral (desestacionalizada)']],
    precios: [['dd', 'Inflación dic/dic (INPC)'], ['prom', 'Inflación promedio anual (INPC)'], ['men', 'Inflación mensual anual a/a (INPC)']]
  };

  /* ---------- estado ---------- */
  var S = { vista: 'crecimiento', ini: Math.max(A0, A1 - 20), fin: A1, serie: 'pibe', cmp: true, modo: 'grafica' };
  (function () {
    var h = (location.hash || '').replace(/^#/, ''); if (!h) return;
    h.split('&').forEach(function (kv) {
      var p = kv.split('='), k = p[0], v = decodeURIComponent(p[1] || '');
      if (k === 'vista' && SERIES[v]) S.vista = v;
      if (k === 'ini' && +v) S.ini = +v;
      if (k === 'fin' && +v) S.fin = +v;
      if (k === 'serie') S.serie = v;
      if (k === 'cmp') S.cmp = (v === '1' || v === 'true');
      if (k === 'modo' && (v === 'grafica' || v === 'tabla')) S.modo = v;
      if (k === 'rango') { var r = v.split('-'); if (+r[0]) S.ini = +r[0]; if (+r[1]) S.fin = +r[1]; }
    });
  })();
  function validSerie() { var ok = SERIES[S.vista].some(function (s) { return s[0] === S.serie; }); if (!ok) S.serie = SERIES[S.vista][0][0]; }
  function pushHash() { location.replace('#vista=' + S.vista + '&serie=' + S.serie + '&ini=' + S.ini + '&fin=' + S.fin + '&cmp=' + (S.cmp ? 1 : 0) + '&modo=' + S.modo); }

  /* ---------- controles ---------- */
  var elIni = document.getElementById('ini'), elFin = document.getElementById('fin'), elSerie = document.getElementById('serie'), elCmp = document.getElementById('cmp');
  elIni.min = A0; elIni.max = A1; elFin.min = A0; elFin.max = A1;
  function sync() {
    validSerie();
    S.ini = Math.min(Math.max(S.ini, A0), A1); S.fin = Math.min(Math.max(S.fin, A0), A1); if (S.ini > S.fin) { var t = S.ini; S.ini = S.fin; S.fin = t; }
    elIni.value = S.ini; elFin.value = S.fin; elCmp.checked = S.cmp;
    elSerie.innerHTML = SERIES[S.vista].map(function (s) { return '<option value="' + s[0] + '">' + s[1] + '</option>'; }).join(''); elSerie.value = S.serie;
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === S.vista); });
    Array.prototype.forEach.call(document.querySelectorAll('#modo button'), function (b) { b.classList.toggle('on', b.getAttribute('data-m') === S.modo); });
    pushHash();
  }
  elIni.addEventListener('change', function () { S.ini = +elIni.value; sync(); render(); });
  elFin.addEventListener('change', function () { S.fin = +elFin.value; sync(); render(); });
  elSerie.addEventListener('change', function () { S.serie = elSerie.value; sync(); render(); });
  elCmp.addEventListener('change', function () { S.cmp = elCmp.checked; sync(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.addEventListener('click', function () { S.vista = b.getAttribute('data-v'); S.serie = SERIES[S.vista][0][0]; sync(); render(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('#modo button'), function (b) { b.addEventListener('click', function () { S.modo = b.getAttribute('data-m'); sync(); render(); }); });

  /* ---------- tarjetas ---------- */
  function cards() {
    var h = '';
    h += card('Crecimiento real ' + C.anioPIBEult + ' (PIBE)', pct(C.crecPIBEnl), 'Nuevo León · dato publicado', C.difCrecPIBEnl, 'vs. nacional ' + pct(C.crecPIBEnac));
    h += card('Nowcast ITAEE ' + C.anioITAEEult + 'T' + C.trimITAEEult, pct(C.crecITAEEnl), 'variación anual, serie original · preliminar', C.difCrecITAEEnl, 'vs. PIB nacional ' + pct(C.crecITAEEnac) + ' · desest. t/t ' + pct(C.crecITAEEsaQnl));
    h += card('Inflación NL ' + MES[C.mesINPCult - 1] + ' ' + C.anioINPCult, pct(C.inflacionNLvig), 'INPC Nuevo León, variación anual', C.difInflacionNLvig, 'vs. nacional ' + pct(C.inflacionNacvig) + ' · dic/dic ' + C.anioInflDDult + ': ' + pct(C.inflacionNLdd));
    h += card('Deflactor PIBE ' + C.anioPIBEult, pct(C.defPIBEnl), 'precios de la producción estatal (implícito)', C.difDefPIBEnl, 'vs. nacional ' + pct(C.defPIBEnac));
    h += card('Proyección ' + C.anioPE + ' (NL)', pct(C.crecPIBEnlPE), 'crecimiento real · criterio del motor', null, 'deflactor ' + pct(C.defPIBEnlPE) + ' · inflación dic/dic ' + pct(C.inflacionNLddPE));
    document.getElementById('cards').innerHTML = h;
  }
  function card(k, v, n, d, dt) { return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="n">' + n + '</div><div class="d">' + (d === null ? '' : '<span class="' + cls(d) + '">' + sgn(d) + '</span> ') + '<span style="color:var(--mut)">' + dt + '</span></div></div>'; }

  /* ---------- datos filtrados (valores del canal, sin recálculo) ---------- */
  function rowsAnual() { return A.filter(function (r) { return r.anio >= S.ini && r.anio <= S.fin; }); }
  function rowsTrim() { return Q.filter(function (r) { return r.anio >= S.ini && r.anio <= S.fin; }); }
  function rowsMen() { return M.filter(function (r) { return r.anio >= S.ini && r.anio <= S.fin; }); }
  /* definición de columnas por serie: [clave, etiqueta, formateador] */
  function colsFor(which) {
    var nac = S.cmp;
    if (which === 'pibe') { var c = [['anio', 'Año', String], ['tipoCrec', 'Tipo', String], ['pibeNnl', 'PIBE NL nominal (mdp)', f0.format], ['pibeRnl', 'PIBE NL real 2018 (mdp)', f0.format], ['crecPIBEnl', 'Crec. real NL %', f2.format], ['nowITAEEnl', 'Nowcast ITAEE NL %', f2.format], ['ntrim', 'Trim. ITAEE', String]]; if (nac) c.push(['crecPIBEnac', 'Crec. real nacional %', f2.format], ['difCrec', 'Dif. NL−nac pp', f2.format], ['nowITAEEnac', 'Nowcast PIB nac %', f2.format]); c.push(['partPIBEnl', 'Part. NL en PIB %', f2.format]); return c; }
    if (which === 'itaee') { var c2 = [['per', 'Trimestre', String], ['itaeenl', 'ITAEE NL (2018=100)', f2.format], ['yoyITAEEnl', 'Var. anual NL %', f2.format]]; if (nac) c2.push(['itaeenac', 'PIB trim. nac (2018=100)', f2.format], ['yoyITAEEnac', 'Var. anual nac %', f2.format]); return c2; }
    if (which === 'itaeesa') { return [['per', 'Trimestre', String], ['itaeeSAnl', 'ITAEE NL desest. (2018=100)', f2.format], ['qoqITAEESAnl', 'Var. trimestral NL %', f2.format], ['yoyITAEESAnl', 'Var. anual desest. NL %', f2.format]]; }
    if (which === 'dd') { var c3 = [['anio', 'Año', String], ['tipoInfl', 'Tipo', String], ['dicnl', 'INPC NL dic', f2.format], ['inflDDnl', 'Inflación dic/dic NL %', f2.format]]; if (nac) c3.push(['dicnac', 'INPC nac dic', f2.format], ['inflDDnac', 'Inflación dic/dic nac %', f2.format], ['difInflDD', 'Dif. NL−nac pp', f2.format]); return c3; }
    if (which === 'prom') { var c4 = [['anio', 'Año', String], ['inpcPromnl', 'INPC NL promedio', f2.format], ['inflPromnl', 'Inflación promedio NL %', f2.format]]; if (nac) c4.push(['inpcPromnac', 'INPC nac promedio', f2.format], ['inflPromnac', 'Inflación promedio nac %', f2.format], ['difInflProm', 'Dif. NL−nac pp', f2.format]); return c4; }
    if (which === 'men') { var c5 = [['per', 'Mes', String], ['inpcnl', 'INPC NL', f2.format], ['yoyINPCnl', 'Inflación anual NL %', f2.format]]; if (nac) c5.push(['inpcnac', 'INPC nacional', f2.format], ['yoyINPCnac', 'Inflación anual nac %', f2.format]); return c5; }
    if (which === 'defl') { var c6 = [['anio', 'Año', String], ['tipoDefl', 'Tipo', String], ['deflnl', 'Deflactor PIBE NL (2018=100)', f2.format], ['varDeflnl', 'Var. deflactor NL %', f2.format], ['inflDDnl', 'Inflación dic/dic NL %', f2.format]]; if (nac) c6.push(['deflnac', 'Deflactor nac (2018=100)', f2.format], ['varDeflnac', 'Var. deflactor nac %', f2.format], ['difDefl', 'Dif. NL−nac pp', f2.format]); return c6; }
    return [];
  }
  function dataFor(which) {
    if (which === 'itaee' || which === 'itaeesa') return rowsTrim().map(function (r) { var o = Object.assign({}, r); o.per = r.anio + 'T' + r.trimestre; return o; });
    if (which === 'men') return rowsMen().map(function (r) { var o = Object.assign({}, r); o.per = r.anio + '-' + String(r.mes).padStart(2, '0'); return o; });
    return rowsAnual();
  }
  function fmtCell(c, v) { if (v === null || v === undefined) return ''; return c[2](v); }
  function rowClass(r, which) { var t = (which === 'dd' || which === 'prom' || which === 'men') ? (r.tipoInfl || '') : (which === 'defl' ? (r.tipoDefl || '') : (r.tipoCrec || '')); return t.indexOf('nowcast') === 0 ? 'r-now' : (t.indexOf('proy') === 0 ? 'r-proy' : ''); }

  /* ---------- procedencia de extractos ---------- */
  function fuentesTxt(which) {
    var ids = { pibe: ['750453', '746097', '753357', '741180', '734407+735143'], itaee: ['741180', '734407+735143'], itaeesa: ['741927'], dd: ['902690', '910392'], prom: ['902690', '910392'], men: ['902690', '910392'], defl: ['750453', '746097', '753357', '902690'] }[which] || [];
    return (P.series || []).filter(function (s) { return ids.indexOf(s.id) >= 0; }).map(function (s) { return s.fuente + ' ' + s.id + (s.area !== '00' ? '/área ' + s.area : '') + ' (consulta INEGI ' + s.consulta + ', último ' + s.ultimo + ')'; });
  }
  function provLines(which, titulo) {
    var L = [];
    L.push('# ' + (D.producto || 'Simulador Fiscal NL') + ' — ' + titulo);
    L.push('# ' + (D.subtitulo || '') + ' · capa ' + (P.version_capa_nl || '') + ' · motor ' + (P.version_motor || '') + ' · corrida ' + (P.generado_en || '') + ' · ' + (P.driver || ''));
    fuentesTxt(which).forEach(function (f) { L.push('# Fuente: ' + f); });
    L.push('# Filtros: vista=' + S.vista + '; serie=' + S.serie + '; rango=' + S.ini + '-' + S.fin + '; comparativo nacional=' + (S.cmp ? 'sí' : 'no'));
    L.push('# Tipos: observado = dato INEGI; nowcast ITAEE = preliminar con trimestres disponibles; proyección geométrica = supuesto de la capa NL (criterio PIBDeflactor)');
    L.push('# Valores del canal (JSON actividad-nl.json), sin recálculo en el navegador; precisión completa');
    return L;
  }
  function tsv(which, titulo, sep) {
    var cols = colsFor(which), rows = dataFor(which), out = provLines(which, titulo).map(function (l) { return sep === ',' ? '"' + l.replace(/"/g, '""') + '"' : l; });
    out.push(cols.map(function (c) { return c[1]; }).join(sep));
    rows.forEach(function (r) { out.push(cols.map(function (c) { var v = r[c[0]]; return (v === null || v === undefined) ? '' : (typeof v === 'number' ? String(v) : String(v)); }).join(sep)); });
    return out.join('\n');
  }
  function copyText(txt, msgEl, fbEl) {
    function fallback() {
      fbEl.value = txt; fbEl.style.display = 'block'; fbEl.focus(); fbEl.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      msgEl.textContent = ok ? 'Copiado (selección). Pega en Excel con Ctrl/Cmd+V.' : 'El navegador bloqueó el portapapeles: el texto está seleccionado abajo, usa Ctrl/Cmd+C.';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { msgEl.textContent = 'Tabla copiada (TSV con procedencia). Pega en Excel con Ctrl/Cmd+V.'; fbEl.style.display = 'none'; }, fallback);
    } else fallback();
  }
  function downloadCsv(txt, name, msgEl, fbEl) {

  document.getElementById('subtitulo').textContent = (D.subtitulo || '') + (P.version_capa_nl ? ' · capa ' + P.version_capa_nl : '');
  document.title = D.titulo || document.title;
  sync(); render(); pie();
})();
</script>
