<script>
	var loader = document.getElementById('la-anim-6-loader')
		, border = document.getElementById('la-anim-6-border')
		, α = 0
		, π = Math.PI
		, t = 15
		
		, tdraw;

	function PieDraw() {
		α++;
		α %= 360;
		var r = ( α * π / 180 )
		, x = Math.sin( r ) * 250
		, y = Math.cos( r ) * - 250
		, mid = ( α > 180 ) ? 1 : 0
		, anim = 'M 0 0 v -250 A 250 250 1 ' 
			   + mid + ' 1 ' 
			   +  x  + ' ' 
			   +  y  + ' z';

		loader.setAttribute( 'd', anim );
		border.setAttribute( 'd', anim );
		if( α != 0 )
		tdraw = setTimeout(PieDraw, t); // Redraw
	}

	function PieReset() {
		clearTimeout(tdraw);
		var anim = 'M 0 0 v -250 A 250 250 1 0 1 0 -250 z';
		loader.setAttribute( 'd', anim );
		border.setAttribute( 'd', anim );
	}

	var inProgress = false;

</script>

<script id="museo-menu-fallback">
/* MUSEO (2026-10-01): el menú lateral venía por AJAX desde PHP. Se carga aquí con JS plano, al margen de la cadena
   de $(document).ready de la página (en incidencia, el demo del velocímetro truena y jQuery 1.10 aborta el resto). */
(function(){
  function carga(){
    var el = document.getElementById('iframeMenu'); if (!el || el.querySelector('.mp-menu')) return;
    var x = new XMLHttpRequest(); x.open('GET', 'parts/menu-left-iva.html', true);
    x.onload = function(){ if (x.status === 200 && !el.querySelector('.mp-menu')) el.innerHTML = x.responseText; };
    x.send();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(carga, 300); }); else setTimeout(carga, 300);
})();
</script>
