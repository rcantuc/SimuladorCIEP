<script type="text/javascript" language="javascript">
$(document).ready(function() {
	
	$('#logo').css('opacity', 0.6); 
	$("#logo").hover(
	   function(){ 
		  $(this).animate({opacity: 0.9}, 100);
	   },  
	   function(){  
		  $(this).animate({opacity: 0.6}, 100);  
	   });  

	$(".pulse").mouseover(function(){ 
		  $(this).animate({opacity: 0}, 100).delay( 100 ).animate({opacity: 1}, 100);
		  //$(this).animate({'background-color': "#f8f9fb"}, 100).delay( 100 ).animate({'background-color': "transparent"}, 100);
	   });  
}); 
</script>
